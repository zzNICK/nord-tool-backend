server:
  port: 8081

spring:
  application:
    name: nord-tool-backend

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/apartamento
    username: user_app_nord
    password: pass_user_nord_local
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      validation-timeout: 5000
      minimum-idle: 1
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: DEBUG
