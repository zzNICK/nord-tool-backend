spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      # Maior arquivo aceito: PDF de termo e contrato (15 MB). Cada tipo tem o seu limite em ArquivoValidador.
      max-file-size: 16MB
      max-request-size: 17MB

server:
  # O contrato de erro é do GlobalExceptionHandler; a página de erro padrão nunca expõe detalhes.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # idCorrelacao vem do CorrelacaoFilter (header X-Request-Id) e aparece também nas respostas de erro.
    level: "%5p [%X{idCorrelacao:-}]"

nord-tool:
  cors:
    # Origens do frontend autorizadas; cada perfil define a sua lista (sem padrão aberto).
    allowed-origins:
  security:
    # Autenticação sempre exigida. Fora do perfil local o startup falha sem chave JWT.
    # NORD_JWT_KEYS="kid1:<base64 de 32+ bytes>;kid2:..." e NORD_JWT_ACTIVE_KID=kid1 (rotação: ver README).
    jwt-keys: ${NORD_JWT_KEYS:}
    active-kid: ${NORD_JWT_ACTIVE_KID:}
    # Compatibilidade: chave única em texto (32+ bytes), usada só se NORD_JWT_KEYS estiver vazia.
    jwt-secret: ${NORD_JWT_SECRET:}
    access-token-minutes: ${NORD_ACCESS_TOKEN_MINUTES:15}
    session-max-hours: ${NORD_SESSION_MAX_HOURS:12}
  admin:
    # Bootstrap do primeiro ADMIN (só roda com a tabela usuario vazia). Remover as variáveis depois.
    email: ${NORD_ADMIN_EMAIL:}
    name: ${NORD_ADMIN_NAME:}
    password: ${NORD_ADMIN_PASSWORD:}
  cotacao:
    # Cotação dos fundos (brapi.dev, plano gratuito). Sem token só alguns tickers respondem; o token nunca é exposto à API.
    url: ${NORD_COTACAO_URL:https://brapi.dev/api}
    token: ${NORD_COTACAO_TOKEN:}
    ttl-seconds: ${NORD_COTACAO_TTL_SEGUNDOS:60}
    timeout-seconds: ${NORD_COTACAO_TIMEOUT_SEGUNDOS:5}
  storage:
    # Provedor de arquivos: POSTGRES (provisório). Definitivo ainda a decidir (Drive/S3).
    provider: ${NORD_STORAGE_PROVIDER:POSTGRES}
