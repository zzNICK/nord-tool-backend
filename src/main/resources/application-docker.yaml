server:
  port: 8081

spring:
  application:
    name: nord-tool-backend

  # Usuário e senha vêm de SPRING_DATASOURCE_USERNAME/SPRING_DATASOURCE_PASSWORD (definidos no Compose).
  datasource:
    url: jdbc:postgresql://postgres:5432/apartamento
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      validation-timeout: 5000
      minimum-idle: 1
      maximum-pool-size: 10

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

nord-tool:
  cors:
    allowed-origins: ${NORD_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
