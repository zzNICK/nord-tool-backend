SPI.COLABORADOR.INSERIR=\
INSERT INTO users (nm_user, nm_celular, id_empresa, id_cargo, id_permissao) \
VALUES (:nome, :celular, :idEmpresa, :idCargo, :idPermissao)

SPU.COLABORADOR.ALTERAR=\
UPDATE users SET \
    nm_user = :nome, \
    nm_celular = :celular, \
    id_empresa = :idEmpresa, \
    id_cargo = :idCargo, \
    id_permissao = :idPermissao \
WHERE id_user = :id

SPD.COLABORADOR.DELETAR=\
DELETE FROM users WHERE id_user = :id

SPS.COLABORADOR.LISTAR=\
SELECT \
    u.id_user AS id, \
    u.nm_user AS nome, \
    u.nm_celular AS celular, \
    u.id_empresa AS idEmpresa, \
    e.nm_empresa AS nomeEmpresa, \
    u.id_cargo AS idCargo, \
    c.nm_cargo AS nomeCargo, \
    u.id_permissao AS idPermissao, \
    p.nm_permissao AS nomePermissao \
FROM users u \
INNER JOIN empresas e ON e.id_empresa = u.id_empresa \
INNER JOIN cargos c ON c.id_cargo = u.id_cargo \
INNER JOIN permissoes p ON p.id_permissao = u.id_permissao \
ORDER BY u.id_user

SPS.COLABORADOR.BUSCAR_POR_ID=\
SELECT \
    u.id_user AS id, \
    u.nm_user AS nome, \
    u.nm_celular AS celular, \
    u.id_empresa AS idEmpresa, \
    e.nm_empresa AS nomeEmpresa, \
    u.id_cargo AS idCargo, \
    c.nm_cargo AS nomeCargo, \
    u.id_permissao AS idPermissao, \
    p.nm_permissao AS nomePermissao \
FROM users u \
INNER JOIN empresas e ON e.id_empresa = u.id_empresa \
INNER JOIN cargos c ON c.id_cargo = u.id_cargo \
INNER JOIN permissoes p ON p.id_permissao = u.id_permissao \
WHERE u.id_user = :id
