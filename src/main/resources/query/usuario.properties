SPS.USUARIO.BUSCAR_POR_EMAIL=\
SELECT u.id_usuario AS id, u.nm_email AS nmEmail, u.nm_nome AS nmNome, u.nm_senha_hash AS nmSenhaHash, \
u.id_perfil AS idPerfil, p.cd_perfil AS cdPerfil, u.in_ativo AS inAtivo, u.nr_falhas_login AS nrFalhasLogin, \
u.dh_bloqueado_ate AS dhBloqueadoAte, u.dh_ultimo_login AS dhUltimoLogin, u.nr_versao_sessao AS nrVersaoSessao \
FROM usuario u JOIN perfil p ON p.id_perfil = u.id_perfil \
WHERE LOWER(u.nm_email) = LOWER(:email)

SPS.USUARIO.BUSCAR_POR_ID=\
SELECT u.id_usuario AS id, u.nm_email AS nmEmail, u.nm_nome AS nmNome, u.nm_senha_hash AS nmSenhaHash, \
u.id_perfil AS idPerfil, p.cd_perfil AS cdPerfil, u.in_ativo AS inAtivo, u.nr_falhas_login AS nrFalhasLogin, \
u.dh_bloqueado_ate AS dhBloqueadoAte, u.dh_ultimo_login AS dhUltimoLogin, u.nr_versao_sessao AS nrVersaoSessao \
FROM usuario u JOIN perfil p ON p.id_perfil = u.id_perfil \
WHERE u.id_usuario = :id

SPS.USUARIO.ESTADO_SESSAO=\
SELECT u.id_usuario AS id, u.in_ativo AS inAtivo, u.nr_versao_sessao AS nrVersaoSessao \
FROM usuario u WHERE u.id_usuario = :id

SPS.USUARIO.CONTAR=\
SELECT COUNT(*) FROM usuario

SPS.USUARIO.PERMISSOES=\
SELECT pp.cd_modulo AS cdModulo, pp.cd_acao AS cdAcao \
FROM perfil_permissao pp WHERE pp.id_perfil = :idPerfil ORDER BY pp.cd_modulo

SPS.USUARIO.PERMISSOES_USUARIO=\
SELECT up.cd_modulo AS cdModulo, up.cd_acao AS cdAcao \
FROM usuario_permissao up WHERE up.id_usuario = :idUsuario ORDER BY up.cd_modulo

SPS.USUARIO.ID_PERFIL_POR_CODIGO=\
SELECT id_perfil FROM perfil WHERE cd_perfil = :cdPerfil

SPI.USUARIO.INSERIR=\
INSERT INTO usuario (nm_email, nm_nome, nm_senha_hash, id_perfil) \
VALUES (:nmEmail, :nmNome, :nmSenhaHash, :idPerfil)

SPU.USUARIO.INCREMENTAR_FALHA=\
UPDATE usuario SET nr_falhas_login = nr_falhas_login + 1 WHERE id_usuario = :id \
RETURNING nr_falhas_login

SPU.USUARIO.BLOQUEAR=\
UPDATE usuario SET dh_bloqueado_ate = :bloqueadoAte WHERE id_usuario = :id

SPU.USUARIO.REGISTRAR_LOGIN=\
UPDATE usuario SET nr_falhas_login = 0, dh_bloqueado_ate = NULL, dh_ultimo_login = now() WHERE id_usuario = :id

SPU.USUARIO.ALTERAR_SENHA=\
UPDATE usuario SET nm_senha_hash = :hash, dh_senha_alterada = now(), nr_versao_sessao = nr_versao_sessao + 1 \
WHERE id_usuario = :id
