name: CI - Build & Test

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Política de testes e convenção de serviços
        run: bash scripts/verificar-politica-testes.sh

      - name: Build e testes
        run: mvn -B clean verify

  segredos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Bloqueante: analisa os commits novos (do PR ou do push), não o histórico inteiro.
      - name: Gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then RANGE="$HEAD~1..$HEAD"; else RANGE="$BASE..$HEAD"; fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --log-opts="$RANGE" --redact --no-banner

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Só relatório: a linha Spring Boot 2.7 (fixada no AGENTS.md) tem CVEs conhecidas sem correção nela.
      - name: OSV-Scanner (pom.xml)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pom.xml

  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build da imagem
        run: docker build -t nord-tool-backend:ci .

      # Só relatório pelo mesmo motivo do OSV; mostra vulnerabilidades altas e críticas da imagem.
      - name: Trivy (imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nord-tool-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
